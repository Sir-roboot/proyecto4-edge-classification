# P4-2.1 — nginx del contenedor consolidado de App Runner.
#
# App Runner expone UN solo puerto (8080, ver Dockerfile.apprunner); este nginx
# es el front: sirve la SPA compilada y reenvía la API al backend Node interno
# en 127.0.0.1:3100.
#
# El `proxy_pass .../:3100/` con barra final (igual que frontend/docker/nginx.conf)
# quita el prefijo `/api/` antes de reenviar: `/api/edge-captures` llega al
# backend como `/edge-captures`. Por eso el backend monta también el alias
# interno `POST /edge-captures` además de `POST /api/edge-captures`.
server {
    listen 8080;
    server_name _;

    # La SPA compilada (etapa de build del frontend) se copia aquí.
    root /app/frontend-dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El contrato fija 10 MiB para la parte `image`; se deja margen para el
        # multipart (metadata + boundaries).
        client_max_body_size 12m;
    }

    # Las llamadas a los servicios Python auxiliares (`/copilot-api/`,
    # `/classifier-api/`) NO tienen destino en App Runner: esta imagen solo
    # incluye backend + frontend. Un 404 explícito lo deja claro en vez de
    # devolver el index.html de la SPA y confundir al portal.
    location /copilot-api/ {
        return 404;
    }

    location /classifier-api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
